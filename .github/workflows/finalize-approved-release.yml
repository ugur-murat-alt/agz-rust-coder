name: Finalize approved 0.2.0 release
on:
  push:
    branches: [maintenance/finalize-0.2.0]
    paths: [.github/workflows/finalize-approved-release.yml]
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79d8e245a57ec5c826ef309ed50e996cf19357cc
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct reviewed portable source corrections
        shell: bash
        run: |
          set -euo pipefail
          git show 10cd693b18a18fff7259d6b75cea8f82f4f502af:maintenance/repair_portable_contracts.py > "$RUNNER_TEMP/portable.py"
          git show 897c681e46ba5429cdc07bad760065ad91907198:maintenance/repair_fixture_bounds.py > "$RUNNER_TEMP/bounds.py"
          git show 5510492d442ec6c01e38cee975285c0c55e17c05:maintenance/repair_cargo_target_path.py > "$RUNNER_TEMP/target.py"
          test "$(git hash-object "$RUNNER_TEMP/portable.py")" = a481f1d2a9484cf2d4fbaa6d6023057664f0fb09
          test "$(git hash-object "$RUNNER_TEMP/bounds.py")" = b0fa747d929cef0e5d8536c860da148ba7181165
          test "$(git hash-object "$RUNNER_TEMP/target.py")" = fa80e2a83afdcfb1cfbce88f2201726fa3002fe2
          python3 "$RUNNER_TEMP/portable.py"
          python3 "$RUNNER_TEMP/bounds.py"
          python3 "$RUNNER_TEMP/target.py"
      - name: Correct native Windows launcher and isolated environment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('xtask/src/opencode.rs')
          text = p.read_text(encoding='utf-8')
          def replace(old, new):
              global text
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new)
          replace('    std::env::var("OPENCODE2_BIN").unwrap_or_else(|_| "opencode2".to_owned())', '''    std::env::var("OPENCODE2_BIN").unwrap_or_else(|_| {
                  // npm installs a .cmd shim on Windows; Rust only infers .exe.
                  if cfg!(windows) { "opencode2.cmd" } else { "opencode2" }.to_owned()
              })''')
          replace('        let home = std::env::var_os("HOME");', '        let home = std::env::var_os("HOME").or_else(|| std::env::var_os("USERPROFILE"));')
          replace('            .env("TMPDIR", &self.tmp_home)', '''            .env("TMPDIR", &self.tmp_home)
                      .env("TMP", &self.tmp_home)
                      .env("TEMP", &self.tmp_home)''')
          replace('        if let Some(rustup_home) = std::env::var_os("RUSTUP_HOME") {', '''        // Retain the selected toolchain, not user credentials or configuration.
                  if let Some(toolchain) = std::env::var_os("RUSTUP_TOOLCHAIN") {
                      command.env("RUSTUP_TOOLCHAIN", toolchain);
                  }
                  #[cfg(windows)]
                  {
                      for name in ["SystemRoot", "WINDIR", "ComSpec", "PATHEXT", "LIB", "LIBPATH", "INCLUDE", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion"] {
                          if let Some(value) = std::env::var_os(name) {
                              command.env(name, value);
                          }
                      }
                      command
                          .env("USERPROFILE", &self.root)
                          .env("APPDATA", &self.config_home)
                          .env("LOCALAPPDATA", &self.data_home);
                  }
                  if let Some(rustup_home) = std::env::var_os("RUSTUP_HOME") {''')
          replace('        } else if let Some(home) = std::env::var_os("HOME") {', '        } else if let Some(home) = home {')
          replace('        root.join("target/debug/agz-rust-coder"),\n        root.join("target/release/agz-rust-coder"),', '''        root.join(format!("target/debug/agz-rust-coder{}", std::env::consts::EXE_SUFFIX)),
                  root.join(format!("target/release/agz-rust-coder{}", std::env::consts::EXE_SUFFIX)),''')
          p.write_text(text, encoding='utf-8', newline='\n')
          # Keep every verification command and identity check. Share build
          # products across package verification and fresh installation instead
          # of recompiling the complete dependency graph in temporary targets.
          p = Path('.github/workflows/release.yml')
          text = p.read_text(encoding='utf-8')
          old = '    name: Verify release artifact\n    runs-on: ubuntu-24.04\n    timeout-minutes: 60\n'
          assert text.count(old) == 1
          text = text.replace(old, old + '    env:\n      CARGO_TARGET_DIR: ${{ github.workspace }}/target\n      CARGO_INCREMENTAL: 0\n')
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          cargo +1.88.0 fmt --all
          cargo +1.88.0 fmt --all --check
          git diff --check
      - name: Commit only reviewed repairs without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          repo = 'ugur-murat-alt/agz-rust-coder'
          parent = '79d8e245a57ec5c826ef309ed50e996cf19357cc'
          expected = {
              '.github/workflows/release.yml',
              'crates/agz-rust-coder/src/workspace/roots.rs',
              'crates/agz-rust-coder/src/workspace/metadata.rs',
              'crates/agz-rust-coder/src/docs/resolver.rs',
              'crates/agz-rust-coder/tests/lsp_manager.rs',
              'crates/agz-rust-coder/tests/lsp_navigation.rs',
              'crates/agz-rust-coder/tests/workspace_selection.rs',
              'crates/agz-rust-coder/tests/protocol_tasks.rs',
              'crates/agz-rust-coder/tests/windows_path_identity.rs',
              'tests/fixtures/lsp/semantic_ra.rs',
              'xtask/src/opencode.rs',
          }
          def api(path, method='GET', data=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path, method=method,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'User-Agent': 'agz-approved-release'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  raw = response.read()
              return json.loads(raw) if raw else None
          assert api('git/ref/heads/main')['object']['sha'] == parent, 'main advanced; refusing to overwrite'
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(changed) == expected, changed
          assert not subprocess.check_output(['git', 'diff', '--name-only']), 'unexpected unstaged changes'
          entries = []
          for name in changed:
              mode, sha, _ = subprocess.check_output(['git', 'ls-files', '--stage', name], text=True).split(maxsplit=2)
              content = subprocess.check_output(['git', 'cat-file', 'blob', sha])
              result = api('git/blobs', 'POST', {'encoding': 'base64', 'content': base64.b64encode(content).decode()})
              assert result['sha'] == sha
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          base = api('git/commits/' + parent)['tree']['sha']
          tree = api('git/trees', 'POST', {'base_tree': base, 'tree': entries})
          assert tree['sha'] == subprocess.check_output(['git', 'write-tree'], text=True).strip()
          commit = api('git/commits', 'POST', {
              'message': 'fix: complete cross-platform release repairs and Windows client integration',
              'tree': tree['sha'], 'parents': [parent]})
          print('REPAIR_COMMIT=' + commit['sha'], flush=True)
          assert api('git/ref/heads/main')['object']['sha'] == parent, 'main advanced; repairs retained without ref update'
          api('git/refs/heads/main', 'PATCH', {'sha': commit['sha'], 'force': False})
          assert api('git/ref/heads/main')['object']['sha'] == commit['sha']
          api('actions/workflows/release.yml/dispatches', 'POST', {
              'ref': 'main', 'inputs': {'tag': 'agz-rust-coder-v0.2.0', 'publish': 'true'}})
          print('DISPATCHED guarded Release on main at ' + commit['sha'], flush=True)
          PY
