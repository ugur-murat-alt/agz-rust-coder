name: Verified source transfer

on:
  push:
    branches: [feat/rust-evidence-and-efficiency]
    paths: [.github/workflows/source-transfer.yml]

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable reviewed baseline without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feb7f1b5fe9022ea09870bc375cded075a27439e
          persist-credentials: false
      - name: Reconstruct reviewed source and upload verified blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, lzma, os, pathlib, subprocess, time, urllib.error, urllib.request

          repo = 'ugur-murat-alt/agz-rust-coder'
          expected_tree = '7ea7929b58e4e749d9f0e3bd41e8a5892dd57233'
          chunks = [
              'a87ba1bb7ea9d84e4408bb08e20fbd91a9598a9c',
              '55e496a81761fba3e21eb0ef5427db01269b5ecf',
              '047e0ba7e3ac7faeb9970544e5d0e01aaf1e5cec',
              'd6433634f40a2bd86e7191e4b83b6d2713b8681d',
              '4285b8d7be486fbd834c3ef9e9812cf4b2983c7a',
              '26a40f80e629c297679472f7d835be50d5780fec',
              'c7df867091fe234ff9596149134f1b02c613d0c0',
              '8c08ce793f1bd284dede768e861a164a1a3c8a68',
          ]
          def api(path, payload=None):
              # This temporary transfer operates only on Git blobs in this repo.
              assert path == 'blobs' or path.startswith('blobs/')
              url = f'https://api.github.com/repos/{repo}/git/{path}'
              data = None if payload is None else json.dumps(payload).encode()
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'agz-reviewed-source-transfer'}
              if data is not None:
                  headers['Content-Type'] = 'application/json'
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(url, data=data, headers=headers)
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise RuntimeError(f'Git blob API failed: HTTP {error.code}') from None
                      time.sleep(2 ** attempt)
              raise RuntimeError('Git blob API retries exhausted')
          def git(*args):
              return subprocess.check_output(['git', *args])
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          compressed = bytearray()
          for sha in chunks:
              obj = api('blobs/' + sha)
              assert obj['encoding'] == 'base64'
              data = base64.b64decode(obj['content'])
              assert len(data) == obj['size'] and blob_sha(data) == sha
              compressed.extend(data)
          assert len(compressed) == 42824
          assert hashlib.sha256(compressed).hexdigest() == 'e566ed4bc1a761974463f3eb0c4703d498b9e26eb8d779a88ce31272b04089e8'
          patch = lzma.decompress(compressed, memlimit=256 * 1024 * 1024)
          assert len(patch) == 164820
          assert hashlib.sha256(patch).hexdigest() == '900e61d9eef826467af91fe42ed9cc4d138d65dbdc797976f20d80188dc86b00'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-source.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', str(path)], check=True)
          assert git('write-tree').decode().strip() == expected_tree
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          changed = [p for p in git('diff', '--cached', '--name-only', '-z').split(b'\0') if p]
          assert len(changed) == 52
          staged = {}
          for entry in git('ls-files', '--stage', '-z').split(b'\0'):
              if not entry:
                  continue
              meta, filename = entry.split(b'\t', 1)
              mode, sha, stage = meta.decode().split()
              assert stage == '0'
              staged[filename] = (mode, sha)
          def upload(filename):
              name = filename.decode('utf-8')
              assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
              mode, sha = staged[filename]
              assert mode in ('100644', '100755')
              data = git('cat-file', 'blob', sha)
              assert blob_sha(data) == sha
              result = api('blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert result['sha'] == sha
              return {'path': name, 'mode': mode, 'type': 'blob', 'sha': sha}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              entries = list(pool.map(upload, changed))
          print('VERIFIED_LOCAL_TREE=' + expected_tree)
          print('VERIFIED_CHANGED_FILES=' + str(len(entries)))
          print('VERIFIED_BLOBS=' + json.dumps(entries, sort_keys=True))
          print('Source blobs uploaded. No remote tree, commit, branch, tag, release, or publication changed.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Exact reviewed local tree: `{expected_tree}`\n\nUploaded {len(entries)} source blobs with verified hashes. No remote tree or ref writes.\n')
          PY
