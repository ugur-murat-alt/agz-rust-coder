name: Optional tools bootstrap
on:
  push:
    branches: [feat/rust-evidence-and-efficiency]
    paths: [.github/workflows/optional-tools-bootstrap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch fixed public tool releases and verify published digests
        shell: bash
        run: |
          mkdir -p optional-tools
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile, urllib.request
          root = pathlib.Path('optional-tools')
          tools = [
              ('nextest-rs/nextest', 'cargo-nextest-0.9.143', 'cargo-nextest-0.9.143-x86_64-unknown-linux-gnu.tar.gz'),
              ('mozilla/sccache', 'v0.17.0', 'sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz'),
          ]
          evidence = []
          for repo, tag, name in tools:
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}', headers={'User-Agent': 'agz-rust-coder-validation'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  release = json.load(response)
              asset, = [a for a in release['assets'] if a['name'] == name]
              digest = asset['digest']
              assert digest.startswith('sha256:')
              with urllib.request.urlopen(asset['browser_download_url'], timeout=60) as response:
                  data = response.read(100 * 1024 * 1024)
              assert 'sha256:' + hashlib.sha256(data).hexdigest() == digest
              archive = root / name
              archive.write_bytes(data)
              evidence.append({'repository': repo, 'tag': tag, 'asset': name, 'digest': digest, 'asset_id': asset['id']})
              print(name, digest)
          (root / 'provenance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Fetch pinned OpenCode smoke client
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" @opencode-ai/cli@0.0.0-beta-18743
          "$RUNNER_TEMP/opencode/node_modules/.bin/opencode2" --version
          tar -C "$RUNNER_TEMP/opencode" -czf optional-tools/opencode-smoke-client.tar.gz node_modules package.json package-lock.json
          (cd optional-tools && sha256sum *.tar.gz provenance.json > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: optional-tools-verified
          path: optional-tools/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
