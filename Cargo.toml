[workspace]
members = ["crates/agz-rust-coder", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Ugur Murat Altintas"]
repository = "https://github.com/ugur-murat-alt/agz-rust-coder"
homepage = "https://github.com/ugur-murat-alt/agz-rust-coder"

[workspace.dependencies]
anyhow = "1.0"
cap-std = "=4.0.3"
cargo-platform = "=0.3.2"
cargo-lock = "=11.1.0"
cargo_metadata = "=0.23.1"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0.0"
fs4 = "=1.1.0"
futures = "0.3"
process-wrap = { version = "=9.0.0", features = ["tokio1"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "rustls"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
assigning_clones = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
default_trait_access = "allow"
derivable_impls = "allow"
doc_markdown = "allow"
format_push_string = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
large_enum_variant = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_fields_in_debug = "allow"
needless_continue = "allow"
needless_lifetimes = "allow"
needless_pass_by_value = "allow"
nonminimal_bool = "allow"
option_option = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
result_large_err = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_char_add_str = "allow"
single_char_pattern = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
unused_async = "allow"
unused_self = "allow"
elidable_lifetime_names = "allow"
ignored_unit_patterns = "allow"
return_self_not_must_use = "allow"
